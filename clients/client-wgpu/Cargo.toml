[package]
default-run = "eldiron-client-wgpu"
name = "eldiron-client-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Eldiron player using the shared native WGPU presentation host."

[[bin]]
name = "eldiron-client-wgpu"
path = "src/main.rs"
required-features = ["native-window"]

[lib]
name = "scenevm_unified_app"
crate-type = ["rlib", "staticlib"]

[features]
default = ["native-window"]
legacy-reference = ["scenevm/windowing"]
native-player = ["dep:eldiron-presentation", "dep:theframework", "dep:renderkit"]
native-window = ["native-player", "theframework/platform-winit"]

[[example]]
name = "native_player"
required-features = ["native-window"]

[dependencies]
eldiron-presentation = {path="../../crates/presentation", optional=true}
theframework = {path="../../crates/theframework", default-features=false, features=["render-wgpu"], optional=true}
renderkit = {path="../../crates/renderkit", optional=true}
eldiron-runtime = { path = "../../crates/runtime" }
rustc-hash = "2"
scenevm = { workspace = true, default-features = false, features=["gpu"] }
rusterix.workspace = true
shared = { path = "../../crates/shared", version = "0.96.0", package = "eldiron-shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.5"
instant = { version = "0.1", features = ["wasm-bindgen"] }
vek = "0.17"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
png = "0.18"

[[bin]]
name = "eldiron-client-wgpu-reference"
path = "src/reference_main.rs"
required-features = ["legacy-reference"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pollster = "0.4"
