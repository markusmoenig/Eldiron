[workspace]
exclude = ["vendor/parley"]

members = ["crates/network", "servers/dedicated", "clients/online", "crates/presentation", "crates/runtime", "crates/renderkit", "crates/theframework-core", "crates/cjk-font-data", "creator", "run-wasm", "crates/ruleset", "crates/shared", "clients/client", "crates/player", "clients/client-terminal", "crates/rusterix", "crates/theframework", "crates/scenevm", "crates/scepter", "crates/icon_builder", "crates/character_generator", "crates/materialz"]
resolver = "2"

[workspace.dependencies]
denrim-materials = { path = "crates/materialz", version = "0.96.0", features = ["wgpu"] }
theframework = { path = "crates/theframework", version = "0.96.0", default-features = false }

rusterix = { path = "crates/rusterix", version = "0.96.0" }
scenevm = { path = "crates/scenevm", version = "0.96.0" }

[workspace.package]
edition = "2024"
version = "0.96.0"
license = "MIT"
authors = ["Markus Moenig"]
description = "A retro-style RPG game creator."
repository = "https://github.com/markusmoenig/Eldiron"
homepage = "https://eldiron.com"

# Full incremental debug histories can retain hundreds of GB of object files
# during repeated editor builds. Keep line-level debugging without that cache.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
