[package]
name = "theframework"
version.workspace = true
edition.workspace = true
license = "MIT AND OFL-1.1"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A cross platform application UI framework."
keywords = ["application", "framework", "graphics", "user-interface", "gui"]
readme = "README.md"
exclude = ["Xcode", "/images"]

[dependencies]
parley = { package = "eldiron-parley", path = "../../vendor/parley", version = "0.9.0", optional = true }
swash = { version = "0.2.10", optional = true }
renderkit = { package = "eldiron-renderkit", version = "0.96.0", path = "../renderkit", optional = true }
lyon_tessellation = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

theframework-core = { version = "0.96.0", path = "../theframework-core" }
log = "0.4"
fontdue = "0.9.3"
maths-rs = { version = "0.2.6", features = [
    "short_types",
    "short_hand_constructors",
    "casts",
    "serde",
    "hash",
] }
vek = { version = "0.17.1", default-features = true }
winit = { version = "0.30", optional = true }
pixels = { version = "0.17.1", optional = true }
rust-embed = { version = "8", default-features = true, features = [
    "include-exclude",
] }
png = "0.17"
rustc-hash = "2.1.1"
futures = { version = "0.3" }
serde = { version = "1.0", features = ["derive"], optional = false }
serde_json = { version = "1.0", optional = false }
rayon = { version = "1" }
vectorize = "0.2.0"
indexmap = { version = "2", features = ["serde"], default-features = true }
zeno = { version = "0.3.1", optional = true }
lazy_static = "1.5.0"
unicode-segmentation = "1.11.0"
half = { version = "2.4", features = ["serde"] }
flags = "0.1.5"
softbuffer = { version = "0.4.6", optional = true }
web-time = "1.1.0"
markdown = "1.0.0"
font-kit = { version = "0.14.3", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dependencies.uuid]
version = "1.1.2"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
    "serde",
    "js",
]

[target.'cfg(any(target_os="macos",target_os="windows",target_os="linux"))'.dependencies]
rfd = { version = "0.17.1", optional = true }
arboard = "3.4.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
syntect = "5.2.0"
log4rs = { version = "1.3.0", features = [
    "compound_policy",
    "fixed_window_roller",
    "rolling_file_appender",
    "size_trigger",
], default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eldiron-cjk-font-data = { path = "../cjk-font-data", version = "0.96.0", optional = true }
# WASM has no runtime filesystem, including development builds.
rust-embed = { version = "8", features = ["debug-embed"] }
console_error_panic_hook = "0.1"
console_log = "1.0.0"
js-sys = "0.3"
getrandom_0_2 = { package = "getrandom", version = "0.2.16", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3.3", features = [
    "wasm_js",
] }
syntect = { version = "5.2.0", default-features = false, features = [
    "default-fancy",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Gpu", "GpuTextureFormat", "Clipboard", "Navigator", "Performance", "Window", "Document", "HtmlElement", "HtmlCanvasElement", "HtmlTextAreaElement", "CompositionEvent", "InputEvent", "KeyboardEvent", "FocusEvent", "Node", "Blob", "BlobPropertyBag"] }

[features]
platform-winit = ["dep:winit", "render-wgpu"]
# Browser RAF/canvas hosting uses Winit's web adapter on the same GPU host.
platform-web = ["platform-winit"]
# Swift supplies CAMetalLayer/lifecycle; this host never selects Winit/Pixels.
platform-apple = ["render-wgpu"]
ui-paint = ["ui", "text"]
paint = []
text = ["paint", "dep:parley", "dep:swash", "dep:eldiron-cjk-font-data"]
render-wgpu = ["text", "dep:renderkit", "dep:lyon_tessellation", "dep:bytemuck"]

desktop-dialogs = ["dep:rfd"]
ui = [ "rayon", "zeno"]
winit_app = ["desktop-dialogs", "dep:winit", "winit_app_pixels"]
winit_app_pixels = ["pixels"]
winit_app_softbuffer = ["desktop-dialogs", "dep:winit", "softbuffer"]
log = ["log4rs"]
i18n = ["font-kit"]

default = ["winit_app"]
rayon = []

[[example]]
name = "native_gpu_ui"
required-features = ["platform-winit", "ui"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"] }

[[example]]
name = "native_gpu_window"
required-features = ["platform-winit"]

[dev-dependencies]
bincode = "1.3"
eldiron-cjk-font-data = { path = "../cjk-font-data", version = "0.96.0" }
