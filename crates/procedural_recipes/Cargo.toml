[package]
name = "procedural-recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone textual procedural tile recipe parser, renderer, and CLI."
readme = "README.md"

[lib]
name = "procedural_recipes"
path = "src/lib.rs"

[[bin]]
name = "procedural-recipes"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
theframework = { path = "../theframework", version = "0.93.0", default-features = false }
ureq = "2.10.1"

