[ruleset]
id = "eldiron.official"
name = "Eldiron Official Ruleset"
version = "1.0.0"
schema_version = "1"
min_engine_version = "0.91.0"
status = "draft"

[schema]
attribute_case = "upper"
time_unit = "seconds"
distance_unit = "tiles"
cooldown_unit = "seconds"
damage_rounding = "round"

[assets.avatars.humanoid]
path = "assets/humanoid.eldiron_avatar"
description = "Editable MZ humanoid: directional sprites in 2D and a rigged mesh in 3D."
geometry = "assets/humanoid.mzgeometry.json"

[assets.avatars.orc]
geometry = "assets/geometry/orc.mzgeometry.json"
path = "assets/orc.eldiron_avatar"
description = "Editable MZ orc with a broad build, pointed ears, tusks and shared equipment sockets."

[assets.avatars.skeleton]
geometry = "assets/geometry/skeleton.mzgeometry.json"
path = "assets/skeleton.eldiron_avatar"
description = "Editable MZ skeleton with open ribs, separate bones, fitted clothing and shared equipment sockets."

[visuals.defaults]
avatar = "humanoid"

[visuals.overrides]
tile_id = "explicit character tile_id wins over ruleset visuals"
avatar = "explicit character avatar/avatar_id wins over ruleset visuals"
empty_visual = "tile_id = \"\" or avatar = \"\" disables inherited default visuals"

[ui.commands.spellbook]
name = "Spellbook"
description = "Open the player-facing collection of known abilities."
icon = "ui_spellbook"

[ui.commands.inventory]
name = "Inventory"
description = "Open the player inventory."
icon = "ui_inventory"

[ui.commands.equipment]
name = "Equipment"
description = "Open the player's equipped gear and avatar."
icon = "ui_equipment"

[ui.commands.preferences]
name = "Preferences"
description = "Open player interface preferences."
icon = "ui_preferences"

[ui.commands.actions]
name = "Actions"
description = "Open the complete ruleset action catalogue."
icon = "ui_actions"

[ui.action_icon_fallbacks]
healing = "minor_heal"
condition = "round_shield"
attack = "basic_attack"
spell = "holy_light"
stance = "round_shield"
interaction = "use"
gather = "gather_herbs"
craft = "use"
default = "use"

[ui.item_icon_fallbacks]
weapon = "basic_attack"
armor = "round_shield"
clothing = "linen_shirt"
container = "small_bag"
ammunition = "wooden_arrows"
reagent = "blessed_herb"
material = "green_wood"
resource = "gather_herbs"
currency = "small_bag"
tool = "use"
default = "use"

[ui.container_templates.default]
mode = "procedural"
columns = 4
slot_size = 32
gap = 4
padding = 8
title = true
background_color = 1
background_color_alpha = 230
border_color = 11
border_color_alpha = 255
slot_color = 14
slot_color_alpha = 204
slot_border_color = 11
slot_border_color_alpha = 255

[ui.container_templates.bag_small]
mode = "procedural"
columns = 3
rows = 2
slot_size = 32
gap = 4
padding = 8
title = true
background_color = 1
background_color_alpha = 230
border_color = 11
border_color_alpha = 255
slot_color = 14
slot_color_alpha = 204
slot_border_color = 11
slot_border_color_alpha = 255

[loot.corpse]
enabled = true
item = "loot_corpse"
include_equipped = true
create_empty = false
despawn_when_empty = true
despawn_seconds = 600
despawn_before_respawn_seconds = 5
name = "{name}'s Remains"
description = "What remains of {name}. Open it to search the carried loot."

[respawn.npc]
enabled = true
delay_seconds = 60
health = "full"
clear_corpse_on_respawn = true

[resource_regen.MP]
amount = 1
per_seconds = 3
max = "MAX_MP"
when = "active"

[resources.wild_herb_node]
name = "Wild Herb Node"
description = "A small wild herb growth that can be gathered for fresh herbs."
kind = "herb"
action = "gather_herbs"
skill = "herbalism"
respawn = 300
amount = 2
produces = { item = "wild_herb", quantity = 2 }
visual_template = "herb_sprig"

[resources.green_wood_node]
name = "Green Wood Node"
description = "A young flexible wood growth that can be gathered for green wood."
kind = "wood"
action = "gather_wood"
skill = "woodworking"
respawn = 300
amount = 3
produces = { item = "green_wood", quantity = 3 }
visual_template = "spear_diagonal"

[resources.bird_nest_node]
name = "Bird Nest Node"
description = "A small nest that can be gathered for usable feathers."
kind = "nest"
action = "gather_feathers"
skill = "fletching"
respawn = 300
amount = 2
produces = { item = "feather", quantity = 2 }
visual_template = "arrow_diagonal"

[resources.moonleaf_patch]
name = "Moonleaf Patch"
description = "A shaded patch of pale leaves beaded with cold dew."
kind = "herb"
action = "gather_moonleaf"
skill = "herbalism"
respawn = 360
amount = 2
produces = { item = "moonleaf", quantity = 2 }
visual_template = "herb_sprig"

[resources.sunstone_outcrop]
name = "Sunstone Outcrop"
description = "A low mineral outcrop glittering with trapped golden light."
kind = "mineral"
action = "mine_sun_shards"
skill = "ritualism"
respawn = 480
amount = 2
produces = { item = "sun_shard", quantity = 2 }
visual_template = "spear_diagonal"

[resources.old_grave]
name = "Old Grave"
description = "A weathered grave whose cold soil is useful in banishing rites."
kind = "grave"
action = "sift_grave_dust"
skill = "ritualism"
respawn = 420
amount = 2
produces = { item = "grave_dust", quantity = 2 }
visual_template = "tombstone_mark"

[resources.resinous_stump]
name = "Resinous Stump"
description = "A fire-scarred stump bleeding beads of warm amber resin."
kind = "resin"
action = "tap_ember_resin"
skill = "alchemy"
respawn = 360
amount = 2
produces = { item = "ember_resin", quantity = 2 }
visual_template = "spear_diagonal"

[crafting]
profession_limit = 0
learn_mode = "use_based"
recipe_knowledge = "open_for_simple"

[crafting.skill_gain]
enabled = true
per_success = 1
below_recommended_bonus = 1
mastery_margin = 20

[skills.fletching]
name = "Fletching"
attribute = "DEX"
min = 0
max = 100

[skills.herbalism]
name = "Herbalism"
attribute = "WIS"
min = 0
max = 100

