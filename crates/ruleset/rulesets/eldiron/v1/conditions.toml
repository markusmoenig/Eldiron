# Conditions are reusable timed or persistent gameplay state.
#
# Actions decide when a condition is applied or removed. The condition owns its
# duration, stacking behavior, tags, trait immunities, gameplay effects, and FX.

[conditions.guarded]
name = "Guarded"
description = "A defensive stance that briefly improves physical protection."
duration = 2.0
stacking = "refresh"
max_stacks = 1
tags = ["stance", "beneficial", "physical"]
immune_traits = []
modifiers = [{ attribute = "ARMOR", add = 2 }]

[conditions.guarded.fx.apply]
preset = "hit_burst"
colors = ["blue", "warm_white"]
duration = "instant"
size = "small"
density = "light"

[conditions.guarded.fx.active]
preset = "holy_glow"
colors = ["blue", "warm_white"]
size = "small"
density = "light"

[conditions.guarded.fx.remove]
preset = "hit_burst"
colors = ["blue"]
duration = "instant"
size = "small"
density = "light"

[conditions.rallied]
name = "Rallied"
description = "Battle momentum improves physical damage and resolve."
duration = 6.0
stacking = "refresh"
max_stacks = 1
tags = ["stance", "beneficial", "physical"]
immune_traits = []
modifiers = [
  { attribute = "DMG", add = 2 },
