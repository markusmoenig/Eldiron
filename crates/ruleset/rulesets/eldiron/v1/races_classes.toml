[professions.Merchant]
description = "Buys and sells goods through shop inventories and price rules."
services = ["buy", "sell"]

[professions.Blacksmith]
description = "Works metal weapons, armor, repairs, and future forge recipes."
services = ["craft", "repair"]
crafting_families = ["weaponsmithing", "armorsmithing"]

[professions.Tailor]
description = "Creates cloth clothing, light armor, and future dye or pattern work."
services = ["craft"]
crafting_families = ["tailoring"]

[professions.Herbalist]
description = "Gathers, sells, and prepares wild herbs for restoration work."
services = ["gather", "buy", "sell"]
crafting_families = ["herbalism"]

[professions.Fletcher]
description = "Makes arrows, bows, shafts, and other light ranged supplies."
services = ["craft"]
crafting_families = ["fletching", "woodworking"]

[professions.Innkeeper]
description = "Provides food, rest, rooms, rumors, and settlement services."
services = ["rest", "buy", "sell"]

[professions.Trainer]
description = "Teaches class abilities, profession recipes, and future skill unlocks."
services = ["train"]

