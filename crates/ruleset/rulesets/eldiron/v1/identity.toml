[identity.defaults]
race = "Human"
class = "Warrior"

[dispositions]
friendly = 1
neutral = 0
hostile = -1

[race_relations.Human]
Human = "friendly"
Orc = "hostile"
Skeleton = "hostile"

[race_relations.Orc]
Human = "hostile"
Orc = "friendly"
Skeleton = "hostile"

[race_relations.Skeleton]
Human = "hostile"
Orc = "hostile"
Skeleton = "friendly"

[reputation]
default = 0
normal = 0

[reputation.thresholds]
hostile = -50
friendly = 50

[intents.walk]
name = "Walk"

[intents.walk.ui]
icon = "walk"

[intents.attack]
deny_message = "{system.cant_do_that}"

[intents.attack.ui]
icon = "basic_attack"

[intents.look]
name = "Look"

[intents.look.ui]
icon = "look"

[intents.use]
distance = 2

[intents.use.ui]
icon = "use"

[intents.open]
name = "Open"
distance = 2
allowed_target_kinds = ["item", "prefab"]

[intents.open.ui]
icon = "open"

[intents.close]
name = "Close"
distance = 2
allowed_target_kinds = ["item", "prefab"]

[intents.close.ui]
icon = "close"

# A targeting affordance: the server resolves the target's current state to an
# explicit Open or Close intent before validating rules and emitting node events.
[intents.open_close]
name = "Open/Close"
distance = 2
allowed_target_kinds = ["item", "prefab"]

[intents.open_close.ui]
icon = "open"

[intents.take]
name = "Take"

[intents.take.ui]
icon = "take"

[intents.drop]
name = "Drop"

[intents.drop.ui]
icon = "drop"
