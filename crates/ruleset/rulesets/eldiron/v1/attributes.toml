[attributes]
primary = ["STR", "DEX", "INT", "WIS", "VIT"]
resources = ["HP", "MAX_HP", "MP", "MAX_MP"]
combat = ["DMG", "POWER", "ARMOR", "RESIST", "FIRE_RESIST", "INIT", "SPEED"]
progression = ["LEVEL", "EXP"]

[attributes.roles]
health = "HP"
max_health = "MAX_HP"
level = "LEVEL"
experience = "EXP"
weapon_damage = "DMG"
armor = "ARMOR"

[attributes.defaults]
HP = 10
MAX_HP = 10
MP = 0
MAX_MP = 0
STR = 10
DEX = 10
INT = 10
WIS = 10
VIT = 10
DMG = 0
POWER = 0
ARMOR = 0
RESIST = 0
FIRE_RESIST = 0
INIT = 0
SPEED = 1
LEVEL = 1
EXP = 0

[derived_stats.MAX_HP]
formula = "base"
minimum = 1

[derived_stats.MAX_MP]
formula = "base"
minimum = 0

[derived_stats.INIT]
formula = "base + floor(max(0, DEX - 10) / 4) + floor(max(0, WIS - 10) / 4)"
minimum = 0

[derived_stats.DMG]
formula = "base + floor(max(0, STR - 10) / 4)"
minimum = 0

[derived_stats.POWER]
formula = "base + floor(max(0, INT - 10) / 4) + floor(max(0, WIS - 10) / 4)"
minimum = 0

[derived_stats.SPEED]
formula = "base + floor(max(0, DEX - 10) / 20)"
minimum = 1
maximum = 3
