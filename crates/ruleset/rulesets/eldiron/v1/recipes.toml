# Recipes transform stackable materials into stackable outputs.
#
# Recipes connect gathering to combat and spellcasting rather than existing as
# an isolated list. Ritual work is intentionally multi-stage: raw world
# materials become prepared reagents, and prepared reagents can also become
# reusable magical equipment. Crafting always creates the item when hard
# requirements are met; skill and attributes determine output quality. Item
# quality and condition are stored as 1..100 percentage values.

[recipes.wooden_arrows]
name = "Wooden Arrows"
description = "Shape green wood into arrow shafts and fletch them with feathers."
skill = "fletching"
required_skill = 0
recommended_skill = 10
difficulty = 10
attribute = "DEX"
profession_hint = "Fletcher"
station = "workbench"
time = 3.0
consumes = [
    { item = "green_wood", quantity = 1 },
    { item = "feather", quantity = 2 },
]
produces = [
    { item = "wooden_arrows", quantity = 10 },
]

