[package]
name = "eldiron-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Renderer-independent local game sessions for Eldiron hosts."
[dependencies]
rusterix = {path="../rusterix",default-features=false}
shared = {package="eldiron-shared",path="../shared",default-features=false}
theframework-core = {path="../theframework-core"}
rustc-hash = "2"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
rmp-serde = "1.3"
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
pollster = "0.4"
