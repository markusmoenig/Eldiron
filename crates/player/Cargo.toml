[package]
name = "eldiron-player"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared Eldiron player application and desktop, browser and Apple host adapters."

[lib]
name = "scenevm_unified_app"
crate-type = ["rlib", "staticlib"]

[features]
default = ["native-window"]
legacy-reference = ["scenevm/windowing"]
native-player = ["dep:theframework", "dep:renderkit"]
native-window = ["native-player", "theframework/platform-winit"]
native-web = ["native-window", "theframework/platform-web"]
native-apple = ["native-player", "theframework/platform-apple"]

[[example]]
name = "legacy_reference"
required-features = ["legacy-reference"]

[dependencies]
eldiron-presentation = {path="../presentation"}
theframework = {path="../theframework", default-features=false, features=["render-wgpu"], optional=true}
renderkit = {path="../renderkit", optional=true}
eldiron-network = { path = "../network" }
eldiron-runtime = { path = "../runtime" }
rustc-hash = "2"
scenevm = { workspace = true, default-features = false, features=["gpu"] }
rusterix.workspace = true
shared = { path = "../shared", version = "0.96.0", package = "eldiron-shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.5"
instant = { version = "0.1", features = ["wasm-bindgen"] }
vek = "0.17"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
futures = "0.3"
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Response", "Document", "Element", "HtmlElement", "Node", "console"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
eldiron-server = { path = "../../servers/dedicated" }
