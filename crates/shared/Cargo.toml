[package]
name = "eldiron-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared code and common types for the Eldiron applications."
keywords = ["game", "rpg", "engine", "shared", "eldiron"]
readme = "README.md"

[dependencies]
theframework.workspace = true
eldiron-ruleset = { path = "../ruleset", version = "0.95.6" }
rusterix = { path = "../rusterix", version = "0.95.6", default-features = false }
scenevm = { path = "../scenevm", version = "0.95.6", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
toml = "0.9"
vectorize = "0.2.0"
rayon = "1"
rand = "0.9"
fontdue = "0.9.3"
line_drawing = "1.0.0"
indexmap = { version = "2", features = ["serde"], default-features = true }
noiselib = "0.2.3"
regex = "1"
num_cpus = "1.16.0"

vek = { version = "0.17", default-features = false, features = ["rgba"] }
earcutr = "0.5"
rect_packer = "0.2.1"
rustc-hash = "2.1.1"
zip = { version = "6.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.10.1", optional = true }
url = { version = "2", optional = true }
ring = { version = "0.17", optional = true }
dirs = { version = "6", optional = true }
tempfile = { version = "3.24", optional = true }
open = { version = "5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ['Window'] }

[features]
default = ["graphics"]
text-ai = ["dep:ureq", "dep:url", "dep:ring", "dep:dirs", "dep:tempfile", "dep:open"]
graphics = ["rusterix/graphics", "scenevm/gpu"]
