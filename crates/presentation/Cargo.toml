[package]
name = "eldiron-presentation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared scene views and graphical game presentation for Eldiron hosts."
[dependencies]
bytemuck = "1.24"
eldiron-runtime = {path="../runtime"}
toml = "0.9"
renderkit = {path="../renderkit"}
scenevm = {path="../scenevm",default-features=false,features=["gpu"]}
rusterix = {path="../rusterix",default-features=false,features=["graphics"]}
theframework-core = {path="../theframework-core"}
rustc-hash = "2"
theframework = {path="../theframework",default-features=false,features=["text"]}
[dev-dependencies]
serde_json = "1"
shared = {package="eldiron-shared",path="../shared",default-features=false}
futures = "0.3"
png = "0.18"
theframework = {path="../theframework",default-features=false,features=["render-wgpu"]}
