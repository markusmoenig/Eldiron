[procedural_materials.linen]
size = 64
seed = 419
tiling = [2.0, 2.0]
source = '''
Material linen
    name = "Woven Linen"
    wrap = Repeat
    Noise Variation
        type = Gradient
        scale = F2(9.0, 9.0)
    Value Weave
        source = 0.60 + 0.24 * Abs(Sin(U * 100.0) * Sin(V * 100.0)) + Variation * 0.16
    Color Dark
        nearest = #909090
    Color Light
        nearest = #ffffff
    Color Cloth
        source = Mix(Dark, Light, Weave)
    Surface
        color = Cloth
        palette = BaseOnly
        roughness = 0.92
        metallic = 0.0
        opacity = 1.0
        emission = 0.0
'''

