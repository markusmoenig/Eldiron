[package]
name = "eldiron-character-generator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone procedural humanoid, equipment, rig, and sprite generator."

[lib]
name = "character_generator"

[[bin]]
name = "character-generator"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }

theframework = { path = "../theframework", default-features = false }
procedural-recipes = { path = "../procedural_recipes", default-features = false }
rusterix = { path = "../rusterix", default-features = false, features = ["graphics"], optional = true }
scenevm = { path = "../scenevm", default-features = false, optional = true }
eldiron-ruleset = { path = "../ruleset", optional = true }
uuid = { version = "1", features = ["v5"], optional = true }

shared = { path = "../shared", package = "eldiron-shared", default-features = false, optional = true }

[[bin]]
name = "character-scene-demo"
path = "src/scene_demo.rs"
required-features = ["scene-demo"]

[features]
default = []
scene-demo = ["eldiron", "dep:shared", "shared/graphics", "scenevm/gpu", "scenevm/windowing"]
eldiron = ["dep:rusterix", "dep:scenevm", "dep:eldiron-ruleset", "dep:uuid"]

[[bin]]
name = "character-bench"
path = "src/bench.rs"
required-features = ["eldiron"]
