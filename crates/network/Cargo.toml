[package]
name = "eldiron-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Networking and public client asset delivery for Eldiron RPGs"
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
shared = { version = "0.96.1", package = "eldiron-shared", path = "../shared", default-features = false }
eldiron-runtime = { version = "0.96.1", path = "../runtime" }
rusterix = { version = "0.96.1", path = "../rusterix", default-features = false }
theframework-core = { version = "0.96.1", path = "../theframework-core" }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
serde_json = "1"
url = "2"
futures-util = { version = "0.3", features = ["sink"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "Event", "CloseEvent", "Window", "Response", "Headers", "AbortController", "AbortSignal", "RequestInit", "RequestRedirect", "RequestCredentials", "ReadableStream", "ReadableStreamDefaultReader"] }

