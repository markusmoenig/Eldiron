[package]
name = "renderkit"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
wgpu = "29.0.3"
half = "2.7"
rustc-hash = "2"
theframework-core = { path = "../theframework-core" }
[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"] }
