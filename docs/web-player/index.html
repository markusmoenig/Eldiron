<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Eldiron Web Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0d0d0d;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d0d0d;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        outline: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d5c4a1;
        font-size: 0.88rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Loading Eldiron…</div>
    <script type="module">
      import init from "../runtime/eldiron-client.js";

      const status = document.querySelector("#status");
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = "The game could not be loaded.";
      }
    </script>
  </body>
</html>
