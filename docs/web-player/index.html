<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Eldiron Web Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0d0d0d;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d0d0d;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        flex: none;
        transform: scale(var(--eldiron-fit-scale, 1));
        transform-origin: center;
      }

      canvas:focus {
        outline: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d5c4a1;
        font-size: 0.88rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Loading Eldiron…</div>
    <script type="module">
      import init from "../runtime/eldiron-client.js";

      const status = document.querySelector("#status");
      const fitCanvas = () => {
        const canvas = document.querySelector("canvas");
        if (!canvas || !canvas.offsetWidth || !canvas.offsetHeight) return;

        const scale = Math.min(
          window.innerWidth / canvas.offsetWidth,
          window.innerHeight / canvas.offsetHeight,
          1,
        );
        const value = String(scale);
        if (canvas.style.getPropertyValue("--eldiron-fit-scale") !== value) {
          canvas.style.setProperty("--eldiron-fit-scale", value);
        }
      };
      const canvasObserver = new MutationObserver(fitCanvas);
      canvasObserver.observe(document.body, {
        attributes: true,
        attributeFilter: ["height", "style", "width"],
        childList: true,
        subtree: true,
      });
      window.addEventListener("resize", fitCanvas);

      const finishLoading = () => {
        status.hidden = true;
        requestAnimationFrame(fitCanvas);
      };
      const isWinitControlFlow = (error) =>
        error instanceof Error &&
        error.message.includes("Using exceptions for control flow");

      const start = async () => {
        try {
          await init();
          finishLoading();
        } catch (error) {
          if (isWinitControlFlow(error)) {
            finishLoading();
            return;
          }
          console.error(error);
          status.textContent = "The game could not be loaded.";
        }
      };

      window.addEventListener(
        "load",
        () => requestAnimationFrame(() => requestAnimationFrame(start)),
        { once: true },
      );
    </script>
  </body>
</html>
