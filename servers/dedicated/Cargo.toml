[package]
name = "eldiron-server"
default-run = "eldiron-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
eldiron-runtime = { path = "../../crates/runtime" }
eldiron-network = { path = "../../crates/network" }
shared = { package = "eldiron-shared", path = "../../crates/shared", default-features = false }
rusterix = { path = "../../crates/rusterix", default-features = false }
theframework-core = { path = "../../crates/theframework-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
argon2 = "0.5.3"
rand = "0.8"
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros", "signal", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
futures-util = { version = "0.3", features = ["sink"] }
[dev-dependencies]
pollster = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
