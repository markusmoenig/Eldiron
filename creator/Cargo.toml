[package]
name = "eldiron-creator"
edition = "2024"
version = "0.96.0"
license = "MIT"
authors = ["Markus Moenig"]
description = "A game creator for classical RPGs."
repository = "https://github.com/markusmoenig/Eldiron"
homepage = "https://eldiron.com"
keywords = ["game", "rpg", "creator", "engine", "eldiron"]
readme = "README.md"
default-run = "eldiron-creator"

[[bin]]
name = "eldiron-creator"
path = "src/main.rs"
required-features = ["native-host"]

[[bin]]
name = "eldiron-creator-native"
path = "src/bin/native_creator.rs"
required-features = ["native-host"]

[[bin]]
name = "eldiron-creator-reference"
path = "src/bin/reference_creator.rs"
required-features = ["reference-cpu"]

[[bin]]
name = "eldiron-creator-web"
path = "src/bin/browser_creator.rs"
required-features = ["browser-host"]

[[example]]
name = "reference_ui_capture"
path = "examples/reference_ui_capture.rs"
required-features = ["reference-cpu"]

[dependencies]
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
web-time = "1.1.0"
eldiron-runtime = { path = "../crates/runtime" }
theframework-core = { path = "../crates/theframework-core" }
renderkit = { path = "../crates/renderkit", optional = true }
eldiron-presentation = { path = "../crates/presentation" }
denrim-materials.workspace = true
wgpu = "29.0.3"
half = "2"
pollster = "0.4"
futures = "0.3"
rusterix.workspace = true
scenevm = { path = "../crates/scenevm", version = "0.96.0", default-features = false, features = ["gpu"] }

shared = { path = "../crates/shared", version = "0.96.0", package = "eldiron-shared", default-features = false, features = ["graphics"] }
eldiron_scepter = { path = "../crates/scepter", version = "0.96.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vectorize = "0.2.0"
rust-embed = { version = "8", default-features = true, features = [
    "include-exclude",
] }
rayon = "1"
png = "0.18"
fontdue = "0.9.3"
indexmap = { version = "2", features = ["serde"], default-features = true }
vek = { version = "0.17.1", default-features = true }
regex = "1.11.1"
toml = "0.8.20"
toml_edit = "0.22.27"
rand = "0.9"
earcutr = "0.5"
lazy_static = "1.5.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = { version = "0.10.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.4.1"
open = "5.0.1"
tempfile = "3.24"
theframework = { path = "../crates/theframework", version = "0.96.0", default-features = false, features = ["ui", "i18n"] }
ureq = "2.10.1"
i18n-embed = { version = "0.16.0", features = ["desktop-requester"] }
self_update = { version = "0.44.0", optional = true, default-features = false, features = [
    "ureq",
    "rustls",
    "compression-flate2",
    "archive-zip",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
i18n-embed = { version = "0.16.0", features = ["web-sys-requester"] }
rust-embed = { version = "8", features = ["debug-embed"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Response", "Headers", "Location", "UrlSearchParams", "Document", "Element", "HtmlElement", "Node", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Event", "Blob", "BlobPropertyBag", "Url", "console", "BeforeUnloadEvent", "AbortController", "AbortSignal", "RequestInit", "RequestCache", "ReadableStream", "ReadableStreamDefaultReader"] }
theframework = { path = "../crates/theframework", version = "0.96.0", default-features = false, features = ["ui"] }

[package.metadata.bundle.bin.eldiron-creator]
name = "Eldiron Creator"
identifier = "com.moenig.eldiron"
icon = ["../build/Eldiron.icns"]
resources = []
copyright = "Copyright (c) Markus Moenig 2025. All rights reserved."
category = "Game"
short_description = "A creator for retro RPGs in text, 2D, and 3D."
long_description = """
Create retro RPGs and interactive-fiction worlds with Eldiron.
Build games that can be played in text, 2D, and 3D.
"""
# cargo build -p eldiron-creator --lib --release --no-default-features --features staticlib
[lib]
name = "eldiron_creator"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["native-host"]
reference-cpu = ["theframework/winit_app"]
browser-host = ["native-render", "theframework/platform-winit"]
native-ui = ["theframework/ui-paint"]
native-host = ["native-render", "theframework/platform-winit", "theframework/desktop-dialogs"]
native-render = ["native-ui", "theframework/render-wgpu", "dep:renderkit"]
log = ["theframework/log"]
self-update = ["dep:self_update"]
staticlib = ["native-render", "theframework/desktop-dialogs"]
