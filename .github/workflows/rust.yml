name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # ────────────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v3

      # ────────────────────────────────────────────────────────────────────────────
      # 2. Windows-only: lift the 260-char limit + shorten Cargo/Rustup locations
      # ────────────────────────────────────────────────────────────────────────────
      - name: Windows – allow long paths & move Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 2a) Tell Git to use the long-path prefix (\\?\)
          git config --system core.longpaths true

          # 2b) Put Cargo/Rustup/target in ultra-short folders on C:\
          echo "CARGO_HOME=C:\\c"                 >> $GITHUB_ENV
          echo "RUSTUP_HOME=C:\\r"                >> $GITHUB_ENV
          echo "CARGO_TARGET_DIR=C:\\t"           >> $GITHUB_ENV

          # 2c) Tell Cargo to fetch git deps with the Git CLI (which obeys 2a)
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────────────────────
      # 3. Linux-only build dependencies (ALSA, GTK)
      # ────────────────────────────────────────────────────────────────────────────
      - name: Prepare (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libfontconfig-dev libfreetype-dev pkg-config
          pkg-config --libs --cflags alsa

      # ----- Install the toolchain (all OSes) -------------------------
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # ────────────────────────────────────────────────────────────────────────────
      # 4. Build
      # ────────────────────────────────────────────────────────────────────────────
      - name: Build graphical release launchers
        shell: bash
        run: |
          cargo build --release --locked --verbose \
            -p eldiron-creator --bin eldiron-creator \
            -p eldiron-client --bin eldiron-client

      - name: Build isolated CPU terminal
        shell: bash
        run: |
          cargo build --release --locked --verbose \
            -p eldiron-client-terminal --bin eldiron-client-terminal --no-default-features

  browser:
    name: WebGPU packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        application: [creator, player]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Package release host and CPU codec worker
        run: python3 tools/package_web.py ${{ matrix.application }} target/web-${{ matrix.application }}

  validation:
    name: Generated assets and framework tests
    runs-on: ubuntu-latest
    # Independent of the build matrix: failed tests must not cancel binary builds.
    steps:
      - uses: actions/checkout@v3

      - name: Prepare (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libfontconfig-dev libfreetype-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable


      - name: Test framework rendering safety and snapshots
        run: cargo test --release --locked -p theframework --features ui

      - name: Upload rendering snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-snapshot-failures
          path: target/ui-snapshots
          if-no-files-found: ignore
