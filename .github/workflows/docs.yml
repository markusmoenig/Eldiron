name: Docs

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/client/**"
      - "crates/**"
      - "run-wasm/**"
      - "source_projects/stonefall-dungeon/build/stonefall-dungeon.eldiron"
      - "starters/projects/Gate.eldiron"
      - "starters/projects/Hideout2D.eldiron"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/client/**"
      - "crates/**"
      - "run-wasm/**"
      - "source_projects/stonefall-dungeon/build/stonefall-dungeon.eldiron"
      - "starters/projects/Gate.eldiron"
      - "starters/projects/Hideout2D.eldiron"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build web client
        working-directory: clients/client
        run: cargo run-wasm --release --package eldiron-client --bin eldiron-client --build-only

      - name: Stage web client and games
        run: npm run stage:web-games

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
